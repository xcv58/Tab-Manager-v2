name: Publish website

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    environment: website-production
    env:
      VERCEL_ORG_ID: team_KOR4nEw8LDQMuEVA1FV5vO9n
      VERCEL_PROJECT_ID: prj_hSUWCLs08IROegSRCjgqFDih1YJP
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Skip a superseded source revision
        id: revision
        run: |
          latest=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer master revision will publish the next complete catalog.'
          fi
      - uses: actions/setup-node@v4
        if: ${{ steps.revision.outputs.current == 'true' }}
        with:
          node-version: 24
      - uses: pnpm/action-setup@v2
        if: ${{ steps.revision.outputs.current == 'true' }}
        with:
          version: 10.32.1
          run_install: false
      - name: Require the production deployment credential
        if: ${{ steps.revision.outputs.current == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'Configure VERCEL_TOKEN in the website-production environment before merging this workflow.' >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
        if: ${{ steps.revision.outputs.current == 'true' }}
      - name: Download and validate the complete release catalog
        if: ${{ steps.revision.outputs.current == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/reports
          node scripts/reports/catalog.mjs .tmp/reports/snapshot.json
      - name: Build one static production snapshot and publish
        if: ${{ steps.revision.outputs.current == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          REPORTS_SNAPSHOT: ${{ github.workspace }}/.tmp/reports/snapshot.json
        run: |
          pnpm dlx vercel@48.6.0 pull --yes --environment=production --token "$VERCEL_TOKEN"
          pnpm dlx vercel@48.6.0 build --prod --token "$VERCEL_TOKEN"
          pnpm dlx vercel@48.6.0 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
      - name: Preserve the exact published catalog
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: website-report-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/reports/snapshot.json
          if-no-files-found: ignore
          retention-days: 90
