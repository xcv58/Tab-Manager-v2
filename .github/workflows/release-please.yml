name: Release Please

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      extension_release_created: ${{ steps.release.outputs['packages/extension--release_created'] == 'true' && steps.version-guard.outputs.allow_release == 'true' }}
      extension_tag_name: ${{ steps.release.outputs['packages/extension--tag_name'] }}
      extension_release_url: ${{ steps.release.outputs['packages/extension--html_url'] }}
    steps:
      - name: Checkout release policy
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check whether the source version may be released
        id: eligibility
        run: node scripts/release-policy.mjs eligibility

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # Prefer a PAT or GitHub App token so the release PR and tags can trigger CI.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: master
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Keep updating the next release PR while 3.0.0 stays a manual baseline.
          skip-github-release: ${{ steps.eligibility.outputs.allow_release != 'true' }}

      - name: Guard the created release before building or publishing
        if: ${{ steps.release.outputs['packages/extension--release_created'] == 'true' }}
        id: version-guard
        env:
          RELEASE_TAG: ${{ steps.release.outputs['packages/extension--tag_name'] }}
          RELEASE_VERSION: ${{ steps.release.outputs['packages/extension--version'] }}
        run: |
          node scripts/release-policy.mjs tag "$RELEASE_TAG" "$RELEASE_VERSION"
          echo "allow_release=true" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build Release
    needs: release-please
    if: ${{ needs.release-please.outputs.extension_release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: build-release-${{ needs.release-please.outputs.extension_tag_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.extension_tag_name }}
          fetch-depth: 0

      - name: Use Node.js 25
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - uses: pnpm/action-setup@v2
        name: Install pnpm
        with:
          version: 10.32.1
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Playwright
        run: pnpm --filter integration-test exec playwright install --with-deps --no-shell chromium

      - name: Release unit tests
        run: |
          mkdir -p .tmp/report-results
          pnpm --filter tab-manager-v2 test --json --outputFile "$GITHUB_WORKSPACE/.tmp/report-results/unit.json"

      - name: Run release gate on Ubuntu
        env:
          RELEASE_REPORTS_DIR: ${{ github.workspace }}/.tmp/report-results
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" pnpm run test:integration

      - name: Build release artifacts
        run: |
          pnpm run deploy
          pnpm run package:firefox-source

      - name: Checksum packages and performance evidence
        run: |
          cd packages/extension
          sha256sum \
            build/build_chrome.zip \
            build/build_firefox.zip \
            build/build_firefox_source.zip \
            > build/SHA256SUMS.txt

      - name: Upload packaged extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-release-${{ needs.release-please.outputs.extension_tag_name }}
          path: |
            packages/extension/build/build_chrome.zip
            packages/extension/build/build_firefox.zip
            packages/extension/build/build_firefox_source.zip
            packages/extension/build/SHA256SUMS.txt
          retention-days: 30

      - name: Archive release gate results even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: report-results-release-${{ github.run_attempt }}
          path: |
            .tmp/report-results/
            packages/integration_test/playwright-report/
            packages/integration_test/test-results/
          if-no-files-found: ignore
          retention-days: 30

  attach-release-assets:
    name: Attach Release Assets
    needs: [release-please, build-release]
    if: ${{ needs.release-please.outputs.extension_release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged extension artifacts
        uses: actions/download-artifact@v4
        with:
          name: extension-release-${{ needs.release-please.outputs.extension_tag_name }}
          path: packages/extension/build

      - name: Verify release artifacts
        working-directory: packages/extension
        run: sha256sum --check build/SHA256SUMS.txt

      - name: Attach artifacts to the GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
            "${{ needs.release-please.outputs.extension_tag_name }}" \
            packages/extension/build/build_chrome.zip \
            packages/extension/build/build_firefox.zip \
            packages/extension/build/build_firefox_source.zip \
            packages/extension/build/SHA256SUMS.txt \
            --clobber \
            --repo "${{ github.repository }}"

  bundle-performance:
    name: Advisory bundle measurement
    needs: [release-please, build-release]
    if: ${{ needs.release-please.outputs.extension_release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.extension_tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: extension-release-${{ needs.release-please.outputs.extension_tag_name }}
          path: packages/extension/build
      - name: Verify packages and expand exact ZIP contents
        working-directory: packages/extension
        run: |
          sha256sum --check build/SHA256SUMS.txt
          unzip -q build/build_chrome.zip -d build/build_chrome
          unzip -q build/build_firefox.zip -d build/build_firefox
      - name: Measure exact packaged release sizes
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.extension_tag_name }}
        run: >-
          node scripts/performance/cli.mjs collect --status released --tag "$RELEASE_TAG"
          --id "bundle-${RELEASE_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          --output packages/extension/build/performance

      - uses: actions/upload-artifact@v4
        with:
          name: performance-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/extension/build/performance/
          if-no-files-found: error
          retention-days: 30

  runtime-performance:
    name: Advisory runtime comparison
    needs: [release-please, build-release]
    if: ${{ needs.release-please.outputs.extension_release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/performance-history.yml
    with:
      head: ${{ needs.release-please.outputs.extension_tag_name }}
      base: auto
      release_tag: ${{ needs.release-please.outputs.extension_tag_name }}

  publish-chrome:
    name: Publish Chrome
    needs: [release-please, build-release]
    if: ${{ needs.release-please.outputs.extension_release_created == 'true' && vars.CHROME_SKIP_RELEASE_TAG != needs.release-please.outputs.extension_tag_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: chrome-web-store
    concurrency:
      group: publish-chrome-${{ needs.release-please.outputs.extension_tag_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.extension_tag_name }}

      - name: Use Node.js 25
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Download packaged extension artifacts
        uses: actions/download-artifact@v4
        with:
          name: extension-release-${{ needs.release-please.outputs.extension_tag_name }}
          path: packages/extension/build

      - name: Verify release artifacts
        working-directory: packages/extension
        run: sha256sum --check build/SHA256SUMS.txt

      - name: Publish to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_JSON: ${{ secrets.CHROME_SERVICE_ACCOUNT_JSON }}
        run: node ./publish_chrome.mjs

  publish-firefox:
    name: Publish Firefox
    needs: [release-please, build-release]
    if: ${{ needs.release-please.outputs.extension_release_created == 'true' && vars.FIREFOX_SKIP_RELEASE_TAG != needs.release-please.outputs.extension_tag_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: firefox-amo
    concurrency:
      group: publish-firefox-${{ needs.release-please.outputs.extension_tag_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.extension_tag_name }}

      - name: Use Node.js 25
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - uses: pnpm/action-setup@v2
        name: Install pnpm
        with:
          version: 10.32.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download packaged extension artifacts
        uses: actions/download-artifact@v4
        with:
          name: extension-release-${{ needs.release-please.outputs.extension_tag_name }}
          path: packages/extension/build

      - name: Verify release artifacts
        working-directory: packages/extension
        run: sha256sum --check build/SHA256SUMS.txt

      - name: Expand Firefox package
        run: |
          mkdir -p packages/extension/build/build_firefox
          unzip -q \
            packages/extension/build/build_firefox.zip \
            -d packages/extension/build/build_firefox

      - name: Submit to Firefox Add-ons
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: pnpm run publish:firefox:sign

  publish-edge:
    name: Publish Edge
    needs: [release-please, build-release]
    if: ${{ needs.release-please.outputs.extension_release_created == 'true' && vars.EDGE_SKIP_RELEASE_TAG != needs.release-please.outputs.extension_tag_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: edge-addons
    concurrency:
      group: publish-edge-${{ needs.release-please.outputs.extension_tag_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.extension_tag_name }}

      - name: Use Node.js 25
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Download packaged extension artifacts
        uses: actions/download-artifact@v4
        with:
          name: extension-release-${{ needs.release-please.outputs.extension_tag_name }}
          path: packages/extension/build

      - name: Verify release artifacts
        working-directory: packages/extension
        run: sha256sum --check build/SHA256SUMS.txt

      - name: Publish to Microsoft Edge Add-ons
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: node ./publish_edge.mjs

  release-summary:
    name: Release Summary
    needs:
      - release-please
      - build-release
      - attach-release-assets
      - publish-chrome
      - publish-firefox
      - publish-edge
    if: ${{ always() && needs.release-please.outputs.extension_release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Summarize release and store submissions
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.extension_tag_name }}
          RELEASE_URL: ${{ needs.release-please.outputs.extension_release_url }}
          BUILD_RESULT: ${{ needs.build-release.result }}
          ASSETS_RESULT: ${{ needs.attach-release-assets.result }}
          CHROME_RESULT: ${{ needs.publish-chrome.result }}
          FIREFOX_RESULT: ${{ needs.publish-firefox.result }}
          EDGE_RESULT: ${{ needs.publish-edge.result }}
          CHROME_SKIPPED_FOR_TAG: ${{ vars.CHROME_SKIP_RELEASE_TAG == needs.release-please.outputs.extension_tag_name }}
          FIREFOX_SKIPPED_FOR_TAG: ${{ vars.FIREFOX_SKIP_RELEASE_TAG == needs.release-please.outputs.extension_tag_name }}
          EDGE_SKIPPED_FOR_TAG: ${{ vars.EDGE_SKIP_RELEASE_TAG == needs.release-please.outputs.extension_tag_name }}
        run: |
          store_row() {
            local store="$1" result="$2" skip_for_tag="$3" status
            case "$result" in
              success) status='Submitted; review and public availability still need verification' ;;
              skipped)
                if [[ "$skip_for_tag" == 'true' && "$BUILD_RESULT" == 'success' ]]; then
                  status='Skipped for this release by repository variable'
                else
                  status='Skipped because a prerequisite did not succeed'
                fi
                ;;
              failure) status='Failed; inspect the publisher logs' ;;
              cancelled) status='Cancelled' ;;
              *) status="Unknown job result: $result" ;;
            esac
            printf '| %s | %s |\n' "$store" "$status"
          }

          {
            printf '## Release %s\n\n' "$RELEASE_TAG"
            printf '[GitHub Release](%s)\n\n' "$RELEASE_URL"
            printf 'Ubuntu release gate and package build: **%s**\n\n' "$BUILD_RESULT"
            printf 'Checksummed GitHub release assets: **%s**\n\n' "$ASSETS_RESULT"
            printf '| Store | Submission status |\n| --- | --- |\n'
            store_row 'Chrome' "$CHROME_RESULT" "$CHROME_SKIPPED_FOR_TAG"
            store_row 'Firefox' "$FIREFOX_RESULT" "$FIREFOX_SKIPPED_FOR_TAG"
            store_row 'Edge' "$EDGE_RESULT" "$EDGE_SKIPPED_FOR_TAG"
            printf '\nA successful submission does not confirm store approval or public availability.\n'
            if [[ "$EDGE_RESULT" == 'skipped' && "$EDGE_SKIPPED_FOR_TAG" == 'true' && "$ASSETS_RESULT" == 'success' ]]; then
              printf '\nTo submit Edge later, run **Retry Edge Release** on the default branch with release tag **%s**. It uses the saved, checksummed package.\n' "$RELEASE_TAG"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release-report:
    name: Publish release report
    needs:
      [
        release-please,
        build-release,
        bundle-performance,
        runtime-performance,
        attach-release-assets,
      ]
    if: ${{ always() && needs.release-please.outputs.extension_release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Archive exact-revision checks and publish manifest last
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.extension_tag_name }}
          REPORT_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/reports/publish.mjs

  website:
    name: Publish website after release evidence
    needs: [release-please, release-report, release-summary]
    if: ${{ always() && needs.release-please.result == 'success' && (needs.release-please.outputs.extension_release_created != 'true' || needs.release-report.result == 'success') }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish-website.yml
    secrets: inherit
