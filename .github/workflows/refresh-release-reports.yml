name: Refresh release reports

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing app release tag to append evidence to (leave empty to refresh website only)
        required: false
        default: ''
      metric_run_id:
        description: Optional completed Advisory Performance History run to import
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-report-refresh
  cancel-in-progress: false

jobs:
  report:
    if: ${{ github.ref_name == github.event.repository.default_branch && inputs.release_tag != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Append a report without changing previous captures
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPORT_WORKFLOW: refresh-release-reports.yml
          METRIC_RUN_ID: ${{ inputs.metric_run_id }}
        run: node scripts/reports/publish.mjs
  website:
    needs: report
    if: ${{ always() && github.ref_name == github.event.repository.default_branch && (inputs.release_tag == '' || needs.report.result == 'success') }}
    uses: ./.github/workflows/publish-website.yml
    secrets: inherit
