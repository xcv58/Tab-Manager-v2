name: Build, Test, Integration Test

on: [push]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-integration-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 25]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: pnpm/action-setup@v2
        name: Install pnpm
        id: pnpm-install
        with:
          version: 10.32.1
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install xvfb
        if: ${{ matrix.node == 25 }}
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Playwright
        if: ${{ matrix.node == 25 }}
        run: pnpm --filter integration-test exec playwright install --with-deps --no-shell chromium

      - name: Unit Test and Build
        if: ${{ matrix.node == 24 }}
        run: |
          pnpm run test:unit
          pnpm build

      - name: Unloaded tab move regression
        timeout-minutes: 5
        if: ${{ matrix.node == 25 }}
        env:
          TM_CHROME_FLAGS_EXTENSION: '1'
        run: |
          pnpm test:integration:build
          pnpm test:integration:unloaded-tabs

      # Run all tests, including the browser integration suite.
      - name: Integration Test
        if: ${{ matrix.node == 25 }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" pnpm run test

      - name: Upload unloaded tab results
        if: ${{ matrix.node == 25 && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unloaded-tab-results
          path: .tmp/issue-2651/production-*-results.json
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
