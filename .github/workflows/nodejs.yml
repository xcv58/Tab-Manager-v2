name: Build, Test, Integration Test

on: [push]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Determine application changes
    runs-on: ubuntu-24.04
    outputs:
      application: ${{ steps.scope.outputs.application }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: scope
        run: node scripts/release/changes.mjs

  report-only:
    name: Validate report data and website
    needs: scope
    if: ${{ needs.scope.outputs.application == 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v2
        with:
          version: 10.32.1
      - run: pnpm install --frozen-lockfile
      - run: node scripts/reports/catalog.mjs
      - run: pnpm build:site

  firefox-integration-test:
    needs: scope
    if: ${{ needs.scope.outputs.application == 'true' }}
    name: Firefox integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.32.1
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Use the real Firefox and geckodriver provisioned on the Ubuntu runner.
      # Fail explicitly if either disappears instead of skipping the suite.
      - name: Check Firefox tooling
        run: |
          set -euo pipefail
          firefox_binary=$(command -v firefox)
          geckodriver_binary=$(command -v geckodriver)
          "$firefox_binary" --version
          "$geckodriver_binary" --version
          echo "FIREFOX_BINARY=$firefox_binary" >> "$GITHUB_ENV"
          echo "GECKODRIVER=$geckodriver_binary" >> "$GITHUB_ENV"

      - name: Build and package Firefox extension
        run: |
          pnpm --filter ./packages/extension build:firefox
          pnpm --filter ./packages/extension zip:firefox

      - name: Firefox browser integration
        env:
          FIREFOX_E2E_ARTIFACTS: ${{ github.workspace }}/.tmp/firefox-e2e
        run: pnpm --filter integration-test-firefox test:firefox:ci

      - name: Firefox unloaded tab move regression
        timeout-minutes: 5
        env:
          TM_BROWSER: firefox
        run: |
          TM_FIREFOX_BINARY="$FIREFOX_BINARY" TM_GECKODRIVER="$GECKODRIVER" \
            pnpm test:integration:unloaded-tabs

      - name: Upload Firefox diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: firefox-integration-results
          path: |
            .tmp/firefox-e2e/
            .tmp/issue-2651/production-firefox-results.json
          retention-days: 30

  test-build-integration-test:
    needs: scope
    if: ${{ needs.scope.outputs.application == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 25]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: pnpm/action-setup@v2
        name: Install pnpm
        id: pnpm-install
        with:
          version: 10.32.1
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release metadata regression
        run: pnpm test:release-metadata

      - name: Dependency security regression
        run: pnpm test:dependency-security

      - name: Capture fixture and media preview regression
        run: pnpm test:capture-sites

      - name: Install xvfb
        if: ${{ matrix.node == 25 }}
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Playwright
        if: ${{ matrix.node == 25 }}
        run: pnpm --filter integration-test exec playwright install --with-deps --no-shell chromium

      - name: Unit Test
        run: |
          mkdir -p .tmp/report-results
          pnpm --filter ./packages/extension test --json --outputFile "$GITHUB_WORKSPACE/.tmp/report-results/unit.json"

      - name: Build extensions
        if: ${{ matrix.node == 24 }}
        run: pnpm build

      - name: Build website with interactive demo
        if: ${{ matrix.node == 24 }}
        run: pnpm build:site

      - name: Upload website preview
        if: ${{ matrix.node == 24 }}
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: dist/site/
          if-no-files-found: error
          retention-days: 30

      - name: Unloaded tab move regression
        timeout-minutes: 5
        if: ${{ matrix.node == 25 }}
        env:
          TM_CHROME_FLAGS_EXTENSION: '1'
        run: |
          pnpm test:integration:build
          pnpm test:integration:unloaded-tabs

      # Run all tests, including the browser integration suite.
      - name: Integration Test
        if: ${{ matrix.node == 25 }}
        env:
          RELEASE_REPORTS_DIR: ${{ github.workspace }}/.tmp/report-results
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" pnpm run test:integration

      - name: Upload unloaded tab results
        if: ${{ matrix.node == 25 && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unloaded-tab-results
          path: .tmp/issue-2651/production-*-results.json
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ matrix.node == 25 && !cancelled() }}
        with:
          name: playwright-report
          path: |
            packages/integration_test/playwright-report/
            packages/integration_test/test-results/
          retention-days: 30

      - name: Archive structured results even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: report-results-node-${{ matrix.node }}-${{ github.run_attempt }}
          path: .tmp/report-results/
          if-no-files-found: ignore
          retention-days: 30
